{% extends "base.html" %}

{% block title %}HelpDesk Profile | NittanyAuction{% endblock %}

{% block content %}
<h1>HelpDesk Profile</h1>
<p><strong>Email (User ID):</strong> {{ user_email }}</p>
<p>Email cannot be changed directly. Use the request form below.</p>

<form method="post" action="{{ url_for('helpdesk.helpdesk_profile') }}">
    <label for="position">Position</label>
    <input id="position" name="position" type="text" value="{{ form_values.position }}" required>

    <label for="new_password">New Password (optional)</label>
    <input id="new_password" name="new_password" type="password" autocomplete="new-password">

    <label for="confirm_password">Confirm New Password</label>
    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password">

    <button type="submit">Save Profile</button>
</form>

<h2>Request Email Change</h2>
<form method="post" action="{{ url_for('helpdesk.helpdesk_profile_email_change_request') }}">
    <label for="requested_email">Requested New Email</label>
    <input id="requested_email" name="requested_email" type="email" required>

    <label for="request_reason">Reason</label>
    <textarea id="request_reason" name="request_reason" rows="3" required></textarea>

    <button type="submit">Submit Request to HelpDesk</button>
</form>

{% endblock %}
